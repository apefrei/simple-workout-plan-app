version: '3.9'

services:
  app:
    container_name: workout-planner-app
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3001}
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - workout-network
    restart: unless-stopped

  api:
    container_name: workout-planner-api
    build:
      context: ./api
      dockerfile: Dockerfile
    ports:
      - "3001:3000"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env.docker
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_HOST=db
      - DATABASE_PORT=5432
      - DATABASE_NAME=${POSTGRES_DB:-workout_planner}
      - DATABASE_USER=${POSTGRES_USER:-postgres}
      - DATABASE_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000}
      - API_PUBLIC_URL=${API_PUBLIC_URL:-http://localhost:3001}
      - TURNSTILE_SECRET_KEY=${TURNSTILE_SECRET_KEY:-}
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    volumes:
      - uploads_data:/app/uploads
    networks:
      - workout-network
    restart: unless-stopped

  db:
    container_name: workout-planner-db
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-workout_planner}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.utf8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-workout_planner}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - workout-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
    name: workout_planner_postgres_data
  uploads_data:
    driver: local
    name: workout_planner_uploads_data

networks:
  workout-network:
    driver: bridge
    name: workout_planner_network
